<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Cumulus</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="../static/css/reg.css">
</head>
<body>
    <div class="register-container">
        <!-- Левая часть с формой -->
        <div class="form-section">
            <div class="form-wrapper">
                <div class="logo">
                    <div class="logo-icon">☁️</div>
                    <h1>CloudGramm</h1>
                    <p>Облачный мессенджер</p>
                </div>

                <div class="form-header">
                    <h2>Создайте аккаунт</h2>
                    <p>Присоединяйтесь к нашему облачному сообществу</p>
                </div>

                <form class="register-form" id="registerForm">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="text" id="firstName" required>
                            <label for="firstName">Имя</label>
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="lastName" required>
                            <label for="lastName">Фамилия</label>
                            <i class="fas fa-user"></i>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <input type="email" id="email" required>
                        <label for="email">Электронная почта</label>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-wrapper">
                        <input type="text" id="username" required>
                        <label for="username">Имя пользователя</label>
                        <i class="fas fa-at"></i>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <input type="password" id="password" required>
                            <label for="password">Пароль</label>
                            <i class="fas fa-lock"></i>
                            <button type="button" class="toggle-password" data-target="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" required>
                            <label for="confirmPassword">Подтвердите пароль</label>
                            <i class="fas fa-lock"></i>
                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            Я принимаю <a href="#">условия использования</a> и <a href="#">политику конфиденциальности</a>
                        </label>
                    </div>

                    <button type="submit" class="register-btn">
                        <span>Создать аккаунт</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>

                <div class="divider">
                    <span>или</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google-btn">
                        <i class="fab fa-google"></i>
                        Продолжить с Google
                    </button>
                    <button class="social-btn github-btn">
                        <i class="fab fa-github"></i>
                        Продолжить с GitHub
                    </button>
                </div>

                <div class="login-link">
                    Уже есть аккаунт? <a href="login.html">Войдите</a>
                </div>
            </div>
        </div>

        <!-- Правая часть с иллюстрацией -->
        <div class="illustration-section">
            <div class="clouds-background">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
            </div>
            <div class="illustration-content">
                <h2>Присоединяйтесь к облачному общению</h2>
                <p>Быстрые сообщения, надежное шифрование и стильный дизайн с облачной тематикой</p>
                <div class="features">
                    <div class="feature">
                        <i class="fas fa-shield-alt"></i>
                        <span>Безопасность</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-bolt"></i>
                        <span>Скорость</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-cloud"></i>
                        <span>Синхронизация</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
